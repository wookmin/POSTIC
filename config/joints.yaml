# Notifyi 6축 관절 매핑.
#
# 현재 측정된 정상 기준 위치를 zero_position으로 사용한다. ID 1과 8은
# 버스에는 연결되어 있지만 유휴 모터라 이 파일의 joints에는 포함하지 않는다.
#
# 아직 각 모터의 + 방향과 기계적 한계를 확정하지 않았으므로, 초기 통합
# 테스트는 zero 기준 ±12도 안에서만 허용한다. 실제 방향을 확인한 뒤
# direction과 상대 범위를 조정한다.

structure:
  dof: pitch_yaw_roll
  active_dof: 6
  units:
    - {index: 1, driven: 2, axis: yaw, role: waist_lower}
    - {index: 2, driven: 3, axis: pitch, role: waist_lower}
    - {index: 3, driven: 4, axis: yaw, role: waist_upper}
    - {index: 4, driven: 5, axis: pitch, role: waist_upper}
    - {index: 5, driven: 6, axis: roll, role: neck_base}
    - {index: 6, driven: 7, axis: yaw, role: neck}

joints:
  waist_lower_yaw:
    id: 2
    group: torso
    input_axis: torso_yaw
    direction: 1              # 실제 좌우 방향 테스트 후 -1/1 확정
    zero_position: 1042
    min_position: 0
    max_position: 4095
    relative_min_deg: -12
    relative_max_deg: 12
    wrap_position: true

  waist_lower_pitch:
    id: 3
    group: torso
    input_axis: torso_pitch
    direction: 1              # 실제 앞/뒤 방향 테스트 후 -1/1 확정
    zero_position: 3042
    min_position: 0
    max_position: 4095
    relative_min_deg: -12
    relative_max_deg: 12
    wrap_position: true

  waist_upper_yaw:
    id: 4
    group: torso
    input_axis: torso_yaw
    direction: 1
    zero_position: 2060
    min_position: 0
    max_position: 4095
    relative_min_deg: -12
    relative_max_deg: 12
    wrap_position: true

  waist_upper_pitch:
    id: 5
    group: torso
    input_axis: torso_pitch
    direction: 1
    zero_position: 59
    min_position: 0
    max_position: 4095
    relative_min_deg: -12
    relative_max_deg: 12
    wrap_position: true

  neck_roll:
    id: 6
    group: neck
    role: neck
    input_axis: neck_roll
    direction: 1
    zero_position: 4087
    min_position: 0
    max_position: 4095
    relative_min_deg: -12
    relative_max_deg: 12
    wrap_position: true

  neck_yaw:
    id: 7
    group: neck
    role: neck
    input_axis: neck_yaw
    direction: 1
    zero_position: 3039
    min_position: 0
    max_position: 4095
    relative_min_deg: -12
    relative_max_deg: 12
    wrap_position: true

unsupported_behaviors:
  - direct_user_pose_mirroring_for_yaw_roll
