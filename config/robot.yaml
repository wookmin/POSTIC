# Dynamixel 버스 설정. 모든 스크립트가 이 파일을 단일 소스로 읽는다.
bus:
  # OpenCR usb_to_dxl 브리지 사용
  port: /dev/ttyACM0
  baudrate: 57600
  protocol: 2.0

motors:
  model: 2XL430-W250

  # 현재 버스 스캔에서 확인된 전체 ID.
  ids: [1, 2, 3, 4, 5, 6, 7, 8]

  # 실제로 동작시키는 모터. 현재 구조에서는 ID 2~7을 사용한다.
  active_ids: [2, 3, 4, 5, 6, 7]

  # 연결되어 있지만 현재 동작시키지 않는 모터.
  # 발열과 전류를 줄이고, 설정되지 않은 축을 실수로 구동하지 않는다.
  unused_ids: [1, 8]
