[project]
name = "posture-robot-proto"
version = "0.1.0"
description = "나쁜 자세 지속 시 고정 포즈로 반응하는 로봇 프로토타입"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
